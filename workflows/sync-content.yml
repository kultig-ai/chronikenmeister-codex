name: Sync content.json from Google Drive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Download content.json from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DRIVE_FILE_ID: '1EUdHxMT-97AtCUxEBTMVjM7zr7wA9whD'
        run: python .github/scripts/sync_content.py

      - name: Commit and push if changed
        run: |
          git config user.name "content-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- content.json; then
            git add content.json
            git commit -m "Sync content.json from Google Drive"
            git push
          else
            echo "Keine Änderungen an content.json."
          fi
